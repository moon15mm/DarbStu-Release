name: Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "رقم الإصدار (مثل 1.0.0)"
        required: false
        default: "1.0.0"
  push:
    branches: ["**"]
    paths:
      - "android_app/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ‏Android SDK مثبّت مسبقاً على مشغّلات ubuntu-latest (ANDROID_HOME)
      # ويُنزّل Gradle أي منصة ناقصة تلقائياً.

      - uses: gradle/actions/setup-gradle@v4

      # التوقيع اختياري: إن أُضيفت الأسرار يُوقَّع APK بمفتاحك الدائم،
      # وإلا يُوقَّع بمفتاح التصحيح (يكفي للتثبيت والتجربة).
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          APP_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          APP_VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/DarbStu-${APP_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DarbStu-apk
          path: android_app/app/build/outputs/apk/release/DarbStu-*.apk
